<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GMP-Grade Enzymes Brochure</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
}

#viewer {
    width: 100%;
    padding: 12px 0 30px;
}

.page {
    width: min(100%, 1000px);
    margin: 0 auto 14px;
    background: #fff;
    box-shadow: 0 1px 6px rgba(0,0,0,.15);
}

.page canvas {
    display: block;
    width: 100%;
    height: auto;
}

#status {
    padding: 20px;
    text-align: center;
    color: #666;
    font-size: 15px;
}

#error {
    display: none;
    padding: 30px 20px;
    text-align: center;
    color: #555;
    line-height: 1.7;
}

#error a {
    display: inline-block;
    margin-top: 12px;
    padding: 11px 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    color: #222;
    text-decoration: none;
    background: #fff;
}

@media (max-width: 600px) {
    #viewer {
        padding-top: 0;
    }

    .page {
        width: 100%;
        margin-bottom: 8px;
    }
}
</style>
</head>

<body>

<div id="status">Loading brochure…</div>
<div id="viewer"></div>

<div id="error">
    Unable to display the brochure in this browser.<br>
    Please open the PDF directly.
    <br>
    <a href="./GMP.pdf">Open PDF</a>
</div>

<script type="module">
import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.worker.min.mjs";

const pdfUrl = "./GMP.pdf";
const viewer = document.getElementById("viewer");
const status = document.getElementById("status");
const error = document.getElementById("error");

async function renderPDF() {
    try {
        const pdf = await pdfjsLib.getDocument({
            url: pdfUrl,
            useWorkerFetch: true,
            isEvalSupported: true
        }).promise;

        status.textContent = `Loading ${pdf.numPages} pages…`;

        for (
            let pageNumber = 1;
            pageNumber <= pdf.numPages;
            pageNumber++
        ) {
            const page = await pdf.getPage(pageNumber);

            const baseViewport =
                page.getViewport({ scale: 1 });

            const containerWidth =
                Math.min(window.innerWidth, 1000);

            const scale =
                containerWidth / baseViewport.width;

            const viewport =
                page.getViewport({ scale });

            const wrapper =
                document.createElement("div");

            wrapper.className = "page";

            const canvas =
                document.createElement("canvas");

            const context =
                canvas.getContext("2d", {
                    alpha: false
                });

            const outputScale =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );

            canvas.width =
                Math.floor(
                    viewport.width * outputScale
                );

            canvas.height =
                Math.floor(
                    viewport.height * outputScale
                );

            canvas.style.width =
                `${viewport.width}px`;

            canvas.style.height =
                `${viewport.height}px`;

            wrapper.appendChild(canvas);
            viewer.appendChild(wrapper);

            await page.render({
                canvasContext: context,
                viewport: viewport,
                transform:
                    outputScale !== 1
                    ? [
                        outputScale,
                        0,
                        0,
                        outputScale,
                        0,
                        0
                      ]
                    : null
            }).promise;
        }

        status.remove();

    } catch (err) {
        console.error(err);
        status.remove();
        error.style.display = "block";
    }
}

renderPDF();
</script>

</body>
</html>
